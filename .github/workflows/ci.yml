name: CI

on:
  push:
    branches: [main, production-v1-base, production-v1-review]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: Run gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          curl --fail --location --silent --show-error "$url" --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --verbose .

  python-lint:
    name: Python lint & format (ruff, black, mypy)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.11"
      - name: Install tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.15.22 black==26.5.1 mypy==2.3.0
      - name: Ruff
        shell: pwsh
        run: ruff check tools/ scripts/ --output-format=github
      - name: Black check
        shell: pwsh
        run: black --check --diff tools/ scripts/
      - name: Mypy
        shell: pwsh
        run: |
          mypy --install-types --non-interactive tools/skills-bridge/ tools/prompt-gallery/ tools/help-index-mcp/ || true

  rust-build:
    name: Rust build & test (bsl-indexer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/code-index-mcp
      - name: cargo clippy
        working-directory: tools/code-index-mcp
        # Enforce stable correctness/performance categories. Two known 0.42.2
        # architectural size warnings require API-shape changes and are handled
        # by the isolated 0.45 upgrade rather than suppressed globally.
        run: >-
          cargo clippy --all-targets --
          -D clippy::correctness
          -D clippy::suspicious
          -D clippy::perf
          -A clippy::result_large_err
          -A clippy::large_enum_variant
      - name: cargo test
        working-directory: tools/code-index-mcp
        run: cargo test --all --no-fail-fast
      # Интеграционные тесты CLI (тяжёлые, marked #[ignore]):
      # roundtrip index→query на фикстуре. Требует собранного release-бинаря,
      # кэш rust-cache сохраняет target/ между шагами — cargo переиспользует артефакты.
      - name: cargo integration test
        if: success()
        working-directory: tools/code-index-mcp
        run: |
          cargo build --release -p bsl-indexer
          cargo test --workspace -- --ignored test_index_then_search_roundtrip
          cargo test --workspace -- --ignored test_stats_with_fixture
          cargo test --workspace -- --ignored test_query_with_fixture
      - name: Generate release indexer checksum
        shell: pwsh
        run: |
          $binary = 'target/release/bsl-indexer.exe'
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $binary).Hash.ToLowerInvariant()
          "$digest  bsl-indexer.exe" | Set-Content -Encoding ascii 'target/release/bsl-indexer.exe.sha256'
        working-directory: tools/code-index-mcp
      - name: Publish release indexer
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: bsl-indexer-windows-x64
          path: |
            tools/code-index-mcp/target/release/bsl-indexer.exe
            tools/code-index-mcp/target/release/bsl-indexer.exe.sha256
          if-no-files-found: error

  powershell-smoke:
    name: PowerShell smoke checks
    runs-on: windows-latest
    needs: rust-build
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.11"
      - name: Download release indexer
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: bsl-indexer-windows-x64
          path: tools/code-index-mcp/target/release
      - name: Parse all PowerShell entrypoints
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @('START_HERE.ps1') +
            (Get-ChildItem .\scripts -Filter '*.ps1' | ForEach-Object { $_.FullName })
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            $path = (Resolve-Path $file).Path
            $content = [System.IO.File]::ReadAllText($path)
            if ($content.Contains([char]0xfffd)) {
              throw "PowerShell source contains an invalid replacement character: $path"
            }
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $path,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors) {
              $messages = $errors | ForEach-Object { $_.Message }
              throw "PowerShell parser failed for $path`: $($messages -join '; ')"
            }
          }
      - name: Prepare Python environment and deterministic index
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactRoot = Join-Path $PWD 'tools\code-index-mcp\target\release'
          $binary = Join-Path $artifactRoot 'bsl-indexer.exe'
          $expected = ((Get-Content -Raw (Join-Path $artifactRoot 'bsl-indexer.exe.sha256')) -split '\s+')[0]
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $binary).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Downloaded bsl-indexer checksum mismatch: expected $expected, got $actual"
          }
          .\scripts\setup.ps1 -SkipBinaryDownload
          $fixture = Join-Path $PWD 'tools\cc-1c-skills\tests\skills\cases\interface-edit\snapshots\basic'
          .\scripts\04_index_1c_dump.ps1 -DumpRoot $fixture -Force
      - name: Run smoke scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          .\scripts\06_healthcheck.ps1
      - name: Skills bridge check
        shell: pwsh
        if: always()
        run: .\scripts\16_check_skills_bridge.ps1
      - name: Prompt gallery check
        shell: pwsh
        if: always()
        run: .\scripts\18_check_prompt_gallery.ps1

  license-check:
    name: License compliance (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: recursive
      - name: Install reuse
        run: python3 -m pip install --disable-pip-version-check reuse==6.2.0
      - name: Reuse lint
        run: reuse lint

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: DavidAnson/markdownlint-cli2-action@992badcdf24e3b8eb7e87ff9287fe931bcb00c6e # v20.0.0
        with:
          globs: |
            **/*.md
            !node_modules/**
            !tools/cc-1c-skills/**
            !tools/code-index-mcp/**

  pre-commit:
    name: Pre-commit (all hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.11"
      - name: Install pre-commit
        run: pip install pre-commit==4.6.0
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ── Полный интеграционный прогон (workspace --all-features, release-бинарь) ──
  # Отделён от rust-build, чтобы:
  #   * не задерживать PR-проверки (rust-build быстрый, cargo-integration тяжёлый);
  #   * иметь отдельный артефакт test-report для дебага.
  # CARGO_TARGET_DIR явно не задан — cargo кладёт target в ./target/ относительно
  # workspace root, что совпадает с rust-build (тот же rust-cache вейркспейс).
  cargo-integration:
    name: Cargo integration tests (full)
    runs-on: windows-latest
    needs: rust-build
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/code-index-mcp
      - name: Build release (all features)
        working-directory: tools/code-index-mcp
        run: cargo build --release --workspace --all-features
      - name: Unit tests
        working-directory: tools/code-index-mcp
        run: cargo test --workspace --all-features --no-fail-fast -- --format=json --report-time > cargo-test-unit.json 2> cargo-test-unit.stderr
        continue-on-error: true
      - name: Integration tests (heavy, --ignored)
        working-directory: tools/code-index-mcp
        run: cargo test --workspace --all-features --no-fail-fast -- --ignored --format=json --report-time > cargo-test-integration.json 2> cargo-test-integration.stderr
        continue-on-error: true
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: cargo-test-report
          path: |
            tools/code-index-mcp/cargo-test-unit.json
            tools/code-index-mcp/cargo-test-unit.stderr
            tools/code-index-mcp/cargo-test-integration.json
            tools/code-index-mcp/cargo-test-integration.stderr
          if-no-files-found: warn
