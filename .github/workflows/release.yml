name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish (for example v0.9.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LOG_STYLE: never
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  signed-windows-release:
    name: Signed Windows production release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/code-index-mcp

      - name: Verify tag and release inputs
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Release tag must be semantic and start with v: $tag"
          }
          $tagCommit = (git rev-list -n 1 $tag).Trim()
          $headCommit = (git rev-parse HEAD).Trim()
          if ($tagCommit -ne $headCommit) { throw "Checked-out HEAD does not match tag $tag" }

      - name: Parse all PowerShell entrypoints
        shell: pwsh
        run: |
          $files = @('START_HERE.ps1') +
            (Get-ChildItem .\scripts -Filter '*.ps1' | ForEach-Object { $_.FullName })
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            $path = (Resolve-Path $file).Path
            $content = [System.IO.File]::ReadAllText($path)
            if ($content.Contains([char]0xfffd)) { throw "Invalid replacement character: $path" }
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $path, [ref]$tokens, [ref]$errors
            )
            if ($errors) { throw "PowerShell parser failed for $path" }
          }

      - name: Build and smoke-test release indexer
        working-directory: tools/code-index-mcp
        shell: pwsh
        run: |
          cargo build --release -p bsl-indexer --features enrichment
          $exe = 'target\release\bsl-indexer.exe'
          if (-not (Test-Path $exe)) { throw 'bsl-indexer.exe missing after build' }
          & $exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "bsl-indexer.exe smoke failed: $LASTEXITCODE" }
          python ..\..\scripts\25_validate_code_index_045.py `
            --binary $exe `
            --report 'target\release\code-index-045-contract.json'
          python ..\..\scripts\26_run_prism_eval.py `
            --binary $exe `
            --json-report 'target\release\prism-1c-eval.json' `
            --markdown-report 'target\release\prism-1c-eval.md'
          $sum = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sum  bsl-indexer.exe" | Set-Content -Encoding ascii 'target\release\bsl-indexer.exe.sha256'

      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $installRoot = Join-Path $env:RUNNER_TEMP 'inno-setup-6.7.3'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') {
            throw "Inno Setup archive checksum mismatch: $actual"
          }
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') {
            throw "Inno Setup Authenticode verification failed: $($signature.Status)"
          }
          $process = Start-Process $installer -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$installRoot`""
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
          "INNO_COMPILER=$installRoot\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare verified offline wheelhouse
        shell: pwsh
        run: .\scripts\23_prepare_offline_wheelhouse.ps1

      - name: Import production Authenticode certificate
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) {
            throw 'Production release requires WINDOWS_SIGNING_CERT_PFX_BASE64 and WINDOWS_SIGNING_CERT_PFX_PASSWORD.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP '1c-ai-workbench-signing.pfx'
          [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation 'Cert:\CurrentUser\My' -Password $password
          if (-not $certificate.HasPrivateKey) { throw 'Imported Authenticode certificate has no private key.' }
          "SIGNING_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIGNING_PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build signed offline installer
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          .\scripts\19_build_windows_installer.ps1 `
            -AppVersion $version `
            -OfflineWheelhouse '.\dist\offline-wheelhouse' `
            -RequireOfflineWheelhouse `
            -InnoCompiler $env:INNO_COMPILER `
            -SignCertificateThumbprint $env:SIGNING_THUMBPRINT `
            -RequireSignature

      - name: Exercise signed installer offline, upgrade and uninstall
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $installer = ".\dist\installer\1c-ai-workbench-setup-$version.exe"
          .\scripts\24_test_windows_installer.ps1 -InstallerPath $installer -RequireSignature

      - name: Publish immutable GitHub release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $version = $tag.Substring(1)
          gh release create $tag `
            ".\tools\code-index-mcp\target\release\bsl-indexer.exe" `
            ".\tools\code-index-mcp\target\release\bsl-indexer.exe.sha256" `
            ".\tools\code-index-mcp\target\release\code-index-045-contract.json" `
            ".\tools\code-index-mcp\target\release\prism-1c-eval.json" `
            ".\tools\code-index-mcp\target\release\prism-1c-eval.md" `
            ".\dist\installer\1c-ai-workbench-setup-$version.exe" `
            ".\dist\installer\1c-ai-workbench-setup-$version.exe.sha256" `
            --verify-tag --generate-notes --title "1C AI Workbench $tag"

      - name: Remove signing material
        if: always()
        shell: pwsh
        run: |
          if ($env:SIGNING_THUMBPRINT -match '^[0-9A-Fa-f]{40}$') {
            $certificatePath = "Cert:\CurrentUser\My\$($env:SIGNING_THUMBPRINT)"
            if (Test-Path $certificatePath) { Remove-Item -LiteralPath $certificatePath -Force }
          }
          if ($env:SIGNING_PFX_PATH -and (Test-Path -LiteralPath $env:SIGNING_PFX_PATH)) {
            Remove-Item -LiteralPath $env:SIGNING_PFX_PATH -Force
          }
