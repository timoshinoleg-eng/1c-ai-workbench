name: 1C AI Workbench — GitVerse / Cloud.ru preflight

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CLOUD_RU_PROJECT_ID: "9dcd962b-a943-4762-9b53-51ad3da59415"

jobs:
  validate:
    name: Security, compliance, tests and Cloud.ru target validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python 3.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.10"

      - name: Install hash-locked CI dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.lock

      - name: Secret scan (gitleaks)
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          curl --fail --location --silent --show-error "$url" --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --verbose .

      - name: License compliance (REUSE)
        run: reuse lint

      - name: Run Python tests
        run: python -m pytest -q

      - name: Validate Cloud.ru project target
        shell: bash
        run: |
          python - <<'PY'
          import os
          import uuid

          value = os.environ["CLOUD_RU_PROJECT_ID"]
          parsed = uuid.UUID(value)
          if str(parsed) != value:
              raise SystemExit("CLOUD_RU_PROJECT_ID is not a canonical UUID")
          print("Cloud.ru project target configured:", value)
          print("Mode: validation-only; no cloud resources are created or changed.")
          PY

      - name: Cloud deployment guard
        run: |
          echo "Artifact Registry / Container Apps deployment is intentionally disabled."
          echo "Enable CD only after protected GitVerse secrets are configured."
